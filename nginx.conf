server {
    listen 80;
    listen [::]:80;
    server_name siswa.pallrzki.my.id;

    root /var/www/porto;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
