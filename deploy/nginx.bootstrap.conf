# Dipakai SEBELUM sertifikat SSL ada. Setelah certbot sukses, ganti ke nginx.conf.
server {
    listen 80;
    listen [::]:80;
    server_name siswa.pallrzki.my.id;

    root /var/www/porto;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location ~ /\. { deny all; }
    location ^~ /deploy { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
